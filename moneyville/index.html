<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description" content="MoneyVille: Life on Allowance — a financial literacy game for children aged 8–14. Learn budgeting, saving, smart shopping, investing and scam awareness through real-world decisions." />
  <title>MoneyVille: Life on Allowance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏙️%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Tiny critical styles so the splash paints instantly, before the bundle loads -->
  <style>
    html,body{margin:0}
    body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#f1f7ff;color:#0f172a}
    .boot-splash{text-align:center;padding:22vh 1rem}
    .boot-mark{font-size:4rem}
    .boot-title{font-size:2rem;font-weight:800;margin-top:.4rem}
    .boot-sub{color:#64748b;margin-top:.3rem}
  </style>
  <link rel="stylesheet" href="dist/moneyville.min.css" />
  <!-- Single bundled+minified script, deferred so HTML/CSS paint first -->
  <script defer src="dist/moneyville.min.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-splash">
      <div class="boot-mark">🏙️</div>
      <div class="boot-title">MoneyVille</div>
      <div class="boot-sub">Loading your town…</div>
    </div>
  </div>

  <noscript>
    <p style="padding:2rem;text-align:center">MoneyVille needs JavaScript enabled to play.</p>
  </noscript>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
