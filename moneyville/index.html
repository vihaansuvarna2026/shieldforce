<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description" content="MoneyVille: Life on Allowance — a financial literacy game for children aged 8–14. Learn budgeting, saving, smart shopping, investing and scam awareness through real-world decisions." />
  <title>MoneyVille: Life on Allowance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏙️%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/moneyville.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-splash">
      <div class="boot-mark">🏙️</div>
      <div class="boot-title">MoneyVille</div>
      <div class="boot-sub">Loading your town…</div>
    </div>
  </div>

  <noscript>
    <p style="padding:2rem;text-align:center;font-family:sans-serif">
      MoneyVille needs JavaScript enabled to play.
    </p>
  </noscript>

  <!-- Content data (levels, badges, config) — separate from game logic -->
  <script src="js/data.js"></script>
  <!-- Engine -->
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
