# Shield Force — Netlify deployment config
# The build copies just the app into www/ (no native projects, store kit or scripts) and
# Netlify serves that folder. It is the same folder the Android and iOS apps are built from.

[build]
  command = "npm run build"
  publish = "www"

# ---------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------
# Note: no strict Content-Security-Policy here on purpose — the pages use
# inline styles and a few inline handlers, so a strict policy would break
# them. The app loads no third-party scripts and makes no network calls,
# which is the protection that actually matters here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # the app requests none of these; deny them at the edge too
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# ---------------------------------------------------------------
# Service worker must never be cached, or users get stuck on an old
# build: the browser would keep re-validating against a stale copy.
# ---------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML: always revalidate so content edits go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons keep their file names between releases, so cache them for a day, not forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/reports/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

# CSS/JS change with releases; revalidate rather than serve stale
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
